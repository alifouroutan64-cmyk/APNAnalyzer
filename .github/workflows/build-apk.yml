name: Build APN Analyzer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ ! -x "$MANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          "$MANAGER" --version

          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            "$MANAGER" "platforms;android-35"
          fi

          if [ ! -f "$SDK/build-tools/34.0.0/aapt" ]; then
            "$MANAGER" "build-tools;34.0.0"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APNAnalyzer-v2.0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
