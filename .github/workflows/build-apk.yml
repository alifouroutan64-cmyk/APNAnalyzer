name: Build APN Analyzer 2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$MANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          chmod +x "$MANAGER"
          yes | "$MANAGER" --licenses || true

          "$MANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APNAnalyzer-v2.0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
